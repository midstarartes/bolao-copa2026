name: Sincronizar resultados da Copa

concurrency:
  group: sync-resultados-copa
  cancel-in-progress: false

on:
  schedule:
    # Horários em UTC. Em Brasília (UTC-3), roda a cada 5 min de 12h30 até 04h00.
    - cron: "30-59/5 15 * * *"
    - cron: "*/5 16-23 * * *"
    - cron: "*/5 0-6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar sincronizacao da API
        env:
          SYNC_URL: https://bolao-copa2026-alpha.vercel.app/api/the-sports-sync
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "AVISO: Secret CRON_SECRET nao configurado no GitHub. Pulando sincronizacao."
            exit 0
          fi

          echo "Chamando sincronizacao automatica..."
          response=$(curl -sS --max-time 30 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL" || echo -e "\nCURL_FAIL")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "HTTP status: $status"
          echo "$body"

          if [ "$status" = "CURL_FAIL" ]; then
            echo "AVISO: Nao foi possivel conectar ao endpoint. Nenhuma acao necessaria."
            exit 0
          fi

          if [ "$status" -ge 500 ]; then
            echo "AVISO: Endpoint retornou erro $status. Verificar logs do servidor."
            exit 0
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha na sincronizacao automatica (status $status)."
            exit 1
          fi

          echo "Sincronizacao concluida com sucesso."
