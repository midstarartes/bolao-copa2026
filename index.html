<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palpites da Copa 2026</title>
  <meta
    name="description"
    content="Bolão da Copa do Mundo 2026 com palpites, extras, moedas, ranking e painel administrativo."
  />
  <meta name="theme-color" content="#1b1b1d" />
  <meta http-equiv="refresh" content="0; url=./design-lab.html" />
  <script>
    window.location.replace("./design-lab.html");
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #3a3a3d, #171719 46%, #09090a);
      color: #f5f5f7;
    }

    .redirect-card {
      width: min(92vw, 420px);
      padding: 28px 24px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .redirect-card h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .redirect-card p {
      margin: 0;
      color: rgba(245, 245, 247, 0.78);
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <h1>Palpites da Copa 2026</h1>
    <p>Redirecionando para a versão principal do bolão...</p>
  </main>
</body>
</html>
